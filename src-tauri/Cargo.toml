[package]
name = "barre-recherche"
version = "0.7.18"
description = "Barre de recherche du poste, à la manière de Spotlight"
edition = "2021"
publish = false

[lib]
name = "barre_recherche"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
gtk = "0.18"
notify = { version = "8", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
unicode-normalization = "0.1"
x11rb = { version = "0.13", features = ["xtest"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
